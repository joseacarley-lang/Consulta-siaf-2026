name: Sincronizar con Hugging Face
on:
  push:
    branches: [ main ] # Si tu rama principal se llama master, cambia main por master

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Subir a Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://github-actions:$HF_TOKEN@huggingface.co/spaces/ACARLEY1986/Consulta Siaf 2026 main
